# A v* tag builds the portable exe (and the Store MSIX) and attaches them, with SHA256SUMS.txt, to a draft GitHub release
# (a pre-release when the tag has a suffix, v1.0.0-rc.1); Jim publishes the draft. A PR that touches
# this file or the Tauri config builds the same exe without releasing it.
# Run workflow (workflow_dispatch) on main with "release" ticked does the same without a local git push: it creates
# the tag v<version> on the commit it built, then the draft release. Without the box it only builds.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - src-tauri/tauri.conf.json
      - src-tauri/Cargo.toml
  workflow_dispatch:
    inputs:
      release:
        description: "Tag main as v<version> and draft the release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: write # gh release create
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.11.1"
          cache: npm
      - run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
      - name: Versions agree
        run: |
          v=$(node -p "require('./package.json').version")
          c=$(node -p "require('./src-tauri/tauri.conf.json').version")
          r=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          [ "$v" = "$c" ] && [ "$v" = "$r" ] || { echo "package.json $v, tauri.conf.json $c, Cargo.toml $r"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          case "$GITHUB_REF_NAME" in
            "v$VERSION" | "v$VERSION"-rc.*) echo "tag $GITHUB_REF_NAME, version $VERSION" ;;
            *) echo "tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1 ;;
          esac
      # Checked before the build, so a wrong branch or a reused version fails in seconds rather than after it.
      - name: Release preflight (Run workflow with release ticked)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "release runs only from main, not $GITHUB_REF"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "tag v$VERSION already exists: bump the version before releasing again"; exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Stage
        run: |
          mkdir -p release
          cp src-tauri/target/release/WallpaperSplitter.exe "release/WallpaperSplitter-$VERSION.exe"
      # The Store package, once the Partner Center identity is saved as repository variables.
      - name: Store package (MSIX)
        if: vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $out = "$env:RUNNER_TEMP/WallpaperSplitter-$env:VERSION"
          ./packaging/msix/stage.ps1 -Exe src-tauri/target/release/WallpaperSplitter.exe -Version $env:VERSION `
            -IdentityName $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER `
            -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME -Out $out
          Move-Item "$out.msix" release/
      - name: Checksums
        run: cd release && sha256sum WallpaperSplitter-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: exe
          path: release/*
          if-no-files-found: error
      # A tag made with github.token starts no new workflow run, so this run is the only one that releases it.
      - name: Tag (Run workflow with release ticked)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          pre=""
          case "$tag" in *-*) pre="--prerelease" ;; esac
          gh release create "$tag" release/WallpaperSplitter-* release/SHA256SUMS.txt \
            --draft $pre --verify-tag --title "Wallpaper Splitter $tag" --generate-notes
