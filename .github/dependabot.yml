# One grouped PR a month at most per ecosystem: each Dependabot PR costs a Greptile review (as LrC-AVG).
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ["*"]
